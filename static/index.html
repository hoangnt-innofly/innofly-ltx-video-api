<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LTX-Video 2B · I2V demo</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --text: #e8eaed; --muted: #9aa3b2; --accent: #7c5cff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    form, .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
    input, textarea { width: 100%; background: #101318; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    button { margin-top: 18px; width: 100%; border: 0; border-radius: 10px; padding: 12px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 16px; color: var(--muted); white-space: pre-wrap; }
    video { width: 100%; margin-top: 16px; border-radius: 12px; background: #000; display: none; }
    a.docs { color: #b9a8ff; }
  </style>
</head>
<body>
  <main>
    <h1>LTX-Video 2B · Image to Video</h1>
    <p class="sub">Upload an image and a prompt. Submit returns a job, then a <code>video_url</code>. API docs: <a class="docs" href="/docs">/docs</a></p>
    <form id="form">
      <label>Image</label>
      <input type="file" name="image" accept="image/jpeg,image/png,image/webp" required />
      <label>Prompt</label>
      <textarea name="prompt" required>A young anime boy slowly turns his head and smiles, cinematic animation</textarea>
      <div class="row">
        <div>
          <label>Width</label>
          <input type="number" name="width" value="512" step="32" />
        </div>
        <div>
          <label>Height</label>
          <input type="number" name="height" value="320" step="32" />
        </div>
        <div>
          <label>Frames (8n+1)</label>
          <input type="number" name="num_frames" value="33" />
        </div>
      </div>
      <button type="submit" id="btn">Generate video</button>
    </form>
    <p id="status"></p>
    <video id="player" controls></video>
  </main>
  <script>
    const form = document.getElementById("form");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("btn");
    const player = document.getElementById("player");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      player.style.display = "none";
      statusEl.textContent = "Uploading…";
      const data = new FormData(form);
      try {
        const res = await fetch("/api/v1/jobs", { method: "POST", body: data });
        const job = await res.json();
        if (!res.ok) throw new Error(job.detail || JSON.stringify(job));
        statusEl.textContent = `Queued ${job.job_id}\nPolling for video_url…`;
        const done = await poll(job.job_id);
        if (done.status !== "succeeded") throw new Error(done.error || done.status);
        statusEl.textContent = `Done.\nvideo_url: ${done.video_url}`;
        player.src = done.video_url;
        player.style.display = "block";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    async function poll(id) {
      while (true) {
        const res = await fetch(`/api/v1/jobs/${id}`);
        const job = await res.json();
        statusEl.textContent = `Job ${id}\nstatus: ${job.status}` + (job.video_url ? `\nvideo_url: ${job.video_url}` : "");
        if (job.status === "succeeded" || job.status === "failed") return job;
        await new Promise((r) => setTimeout(r, 2000));
      }
    }
  </script>
</body>
</html>
